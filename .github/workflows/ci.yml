name: VisionBridge CI

on:
  push:
    branches: [mlops-ese]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this commit to the tagged EC2 demo instance
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install gradio==6.13.0 Pillow==12.3.0 pytest
      - run: python -m unittest discover -s tests -p test_mlops_pipeline.py -v
      - run: python -m unittest discover -s tests -p test_cloud_workspace.py -v
      - run: python -m pytest tests/test_workspace_models.py tests/test_voice_flow.py -q
      - run: python -m compileall -q mlops
      - run: python -m compileall -q launch_workspace.py visionbridge modules/local_vision.py

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/visionbridge-mlops:$IMAGE_TAG"
          docker build -f Dockerfile.mlops -t "$image" .
          docker push "$image"
      - name: Build and push MAI workspace image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/visionbridge-workspace:$IMAGE_TAG"
          docker build -f Dockerfile.workspace -t "$image" .
          docker push "$image"

  deploy:
    needs: publish
    if: github.event_name == 'push' || inputs.deploy == true
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd.yml
