<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisionBridge — Visual Question Answering</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #15233b; background: #f3f7fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); background: white; border: 1px solid #d7e2f0; border-radius: 20px; padding: clamp(22px, 5vw, 40px); box-shadow: 0 16px 50px #17365a13; }
    .eyebrow { color: #285cb4; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; }
    p { line-height: 1.55; color: #506079; }
    form { display: grid; gap: 18px; margin-top: 28px; }
    label { display: grid; gap: 8px; font-weight: 650; }
    input { width: 100%; border: 1px solid #b8c9df; border-radius: 10px; padding: 12px; font: inherit; background: white; }
    input:focus, button:focus { outline: 3px solid #82b8ff; outline-offset: 2px; }
    #preview { display: none; width: 100%; max-height: 320px; object-fit: contain; border-radius: 10px; background: #eef3f9; }
    button { background: #2059b4; color: white; border: 0; border-radius: 10px; padding: 14px 20px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #164994; }
    button:disabled { background: #8fa8cc; cursor: wait; }
    #result { min-height: 64px; margin-top: 22px; padding: 16px; border-radius: 10px; background: #edf5ff; font-size: 1.15rem; font-weight: 650; }
    #status { font-size: .88rem; color: #506079; }
    small { color: #65758d; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">VisionBridge · VQA demo</div>
    <h1>Ask about an image</h1>
    <p>Upload a picture, type a question, and the model will answer it.</p>
    <div id="status" role="status">Checking model…</div>
    <form id="form">
      <label>Choose an image (up to 5 MB)
        <input id="image" type="file" accept="image/*" required>
      </label>
      <img id="preview" alt="Selected image preview">
      <label>Your question
        <input id="question" type="text" maxlength="500" value="What is in this picture?" required>
      </label>
      <button id="submit" type="submit">Get answer</button>
    </form>
    <div id="result" role="status" aria-live="polite">Your answer will appear here.</div>
    <p><small>This course demo serves the VisionBridge VQA model. Use non-sensitive images only.</small></p>
  </main>
  <script>
    const form = document.getElementById('form');
    const image = document.getElementById('image');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const button = document.getElementById('submit');
    image.addEventListener('change', () => {
      if (image.files[0]) {
        preview.src = URL.createObjectURL(image.files[0]);
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    });
    fetch('/health').then(r => r.json()).then(data => {
      document.getElementById('status').textContent = data.status === 'ok' ? 'Model ready' : 'Model unavailable';
    }).catch(() => { document.getElementById('status').textContent = 'Model unavailable'; });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const file = image.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { result.textContent = 'Choose an image under 5 MB.'; return; }
      button.disabled = true;
      result.textContent = 'Thinking…';
      try {
        const image_base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const response = await fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({image_base64, question: document.getElementById('question').value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Prediction failed');
        result.textContent = `Answer: ${data.answer}`;
      } catch (error) {
        result.textContent = `Error: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
